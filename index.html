<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Gear Check</title>
  <meta name="theme-color" content="#0f1115" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gear Check" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">CTN Visuals</p>
        <h1 id="screenTitle">Gear Check</h1>
      </div>
      <button class="icon-button" id="quickAddBtn" aria-label="Adaugă rapid">＋</button>
    </header>

    <main id="view" class="view"></main>

    <nav class="tabbar" aria-label="Navigație principală">
      <button data-tab="dashboard" class="tab active"><span>⌂</span><small>Acasă</small></button>
      <button data-tab="inventory" class="tab"><span>▦</span><small>Gear</small></button>
      <button data-tab="bags" class="tab"><span>▣</span><small>Bagaje</small></button>
      <button data-tab="templates" class="tab"><span>☑</span><small>Template</small></button>
      <button data-tab="sessions" class="tab"><span>↺</span><small>Sesiuni</small></button>
    </nav>
  </div>

  <dialog id="modal" class="modal">
    <form method="dialog" class="modal-card" id="modalCard">
      <div class="modal-head">
        <h2 id="modalTitle">Adaugă</h2>
        <button type="button" class="ghost tiny" id="closeModalBtn">Închide</button>
      </div>
      <div id="modalBody"></div>
    </form>
  </dialog>

  <input type="file" id="importFile" accept="application/json,.json" hidden />
  <script src="app.js"></script>
</body>
</html>
